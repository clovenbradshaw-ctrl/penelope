<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>mouth gym — prompt the local system, watch the scoreboard</title>
<style>
body{font:14px system-ui,sans-serif;margin:0;background:#0b1020;color:#e5e7eb;display:grid;grid-template-columns:7fr minmax(260px,3fr);min-height:100vh}
#chat{padding:16px}#board{border-left:1px solid #1f2937;padding:16px;background:#0f172a}
#log{max-height:60vh;overflow:auto;border:1px solid #1f2937;border-radius:10px;padding:10px;margin:10px 0}
.msg{margin:8px 0}.msg.u{color:#7dd3fc}.msg .ok{color:#4ade80}.msg .bad{color:#f87171}
.row{display:flex;gap:8px;margin:8px 0}input,select,button{padding:8px;border-radius:8px;border:1px solid #374151;background:#111c34;color:#e5e7eb}
input{flex:1}button{cursor:pointer}
.taskbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
table{width:100%;font-size:12px;border-collapse:collapse}td,th{border-bottom:1px solid #1f2937;padding:4px;text-align:left}
.hint{color:#9ca3af;font-size:12px}
</style></head><body>
<div id="chat">
<h2>mouth gym</h2>
<div class="hint">Free chat prompts gemma2:2b. Rung buttons re-run ladder tasks: the mouth draws, the <b>organ probes</b>, pass = mouth wins, fail = box keeps it. The model doesn't learn — the <i>system</i> does (standing rules). <a href="/launch-facing.html" style="color:#7dd3fc">facing page</a></div>
<div class="taskbtns">
<button data-rung="fmtAgo">run rung: fmtAgo</button>
<button data-rung="filter">run rung: filter+resolve</button>
<button data-rung="paths">run rung: detail paths</button>
</div>
<div id="log"></div>
<div class="row"><input id="q" placeholder="ask the local mouth anything…"><button id="send">send</button></div>
</div>
<div id="board"><h3>scoreboard</h3><div id="score">loading…</div></div>
<script>
const log=document.getElementById('log'),scoreEl=document.getElementById('score');
const say=(cls,html)=>{const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;log.append(d);log.scrollTop=1e6;};
async function refresh(){
  const s=await (await fetch('/api/score')).json();
  scoreEl.innerHTML=s.tasks.length?('<table><tr><th>task</th><th>att</th><th>pass</th><th>mouth</th><th>box</th></tr>'+s.tasks.map(t=>`<tr><td>${t.task}</td><td>${t.attempts}</td><td>${t.passes}</td><td>${t.mouth}</td><td>${t.box}</td></tr>`).join('')+'</table>'):'no rung attempts yet — press a button.';
}
document.querySelectorAll('[data-rung]').forEach(b=>b.onclick=async()=>{
  say('u','▶ rung: '+b.dataset.rung+' (drawing…)');
  const r=await (await fetch('/api/rung',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({task:b.dataset.rung})})).json();
  say('',(r.pass?'<span class="ok">PASS — mouth wins</span>':'<span class="bad">FAIL — box keeps it</span>')+' · '+r.model+'<br>'+r.results.map(x=>(x.ok?'✓ ':'✗ ')+x.want+' ← '+x.got).join('<br>'));
  refresh();
});
document.getElementById('send').onclick=async()=>{
  const q=document.getElementById('q');if(!q.value.trim())return;
  say('u','you: '+q.value.replace(/</g,'&lt;'));
  const v=q.value;q.value='';
  const r=await (await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:v})})).json();
  say('',(r.text||'(empty)').replace(/</g,'&lt;').slice(0,1200));
};
refresh();
</script></body></html>
