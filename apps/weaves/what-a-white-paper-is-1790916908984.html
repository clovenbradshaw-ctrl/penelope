<div class="mast"><h1>What a White Paper Is</h1><div class="tag">discovered, not defined · 2026-10-02 · DMD against the essay ground</div><div class="meta">giver: the asker (a white paper hunts and discovers) · witnesses: gmu, purdue, wikipedia, stanford, techtarget, iit, britannica, enlightened, opentext, f5, dell · ground: the Fold's own essays</div></div>

<div class="standing"><pre id="meta" style="font:11px monospace;white-space:pre-wrap"></pre></div>
<script>
document.getElementById("wp").textContent = "# What a White Paper Is — Discovered, Not Defined\n\nA white paper written by hunting: the definition is not planted and not appealed to from the Fold's own documents. It is what the world's genre authorities and real white papers carry, run through the Fold's own consensus gate (frequency + growth, Hoeffding bound, no fixed N) against the essay as ground. Standing: measured-with-dissent — the discovery is that the genre will not certify, and the refusal is the finding.\n\n## The discovery\n\nNo feature cleared the bound as a present mode. The honest result is MORE witnesses, not a definition.\n\nThe only modes the white-paper corpus sustained at the bound were ABSENCES — the genre refuses numbered sections (1.0, 2.0) and call to action. Not one of the genre authorities' advertised present features (executive summary, problem statement, solution, references) cleared 0.77 at 11 witnesses; the strongest was solution at 6/11. The genre is certified only by what it refuses, and that is not enough to define it.\n\nThe essay ground's present modes: named author (4/4).\n\nSo the discovered state is not a definition but a refusal: on this corpus, at this bound, a white paper cannot be told from the essay ground by any present feature the authorities advertise. The DMD's answer is MORE — more witnesses, more documents read as themselves, not as guides describing them — before any mode may be declared. That refusal is the finding on the record.\n\n## The aperture — what could refute this\n\n1. The corpus is small (11 white-paper witnesses) and self-selected from genre authorities and vendor examples; a different sample could shift the modes. The gate says what these witnesses carry, not what all white papers carry.\n2. Two witnesses are genre GUIDES (gmu, purdue) rather than white papers themselves — they describe the form and so trivially contain its vocabulary. The discovery leans on the nine actual papers, but the guides' presence is a bias toward the stereotype.\n3. The ground is the Fold's own essays (4), not a corpus of the world's essays; the 'difference' is partly the difference between the Fold's house voice and the world's business register.\n4. Feature tests are word-presence heuristics: 'solution' can appear in an essay too. The gate is a nomination; descent to actual documents would be the proof.\n\n## The falsification — registered before the claim ships\n\nThis discovery fails if: (a) an essay corpus of comparable size clears the same features at the same bound (then problem-solution is not the white paper's, it is everyone's); or (b) the eleven witnesses, re-pulled by an independent hunt, no longer carry the features (then the corpus was the finding, not the genre); or (c) a white paper is found that deliberately omits all five and is still read as a white paper by its audience (then the definition is a stereotype, and the stereotype is the finding). Reproduce, then cite.";
document.getElementById("meta").textContent = "gates: all pass";
</script>
