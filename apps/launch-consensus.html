<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upcoming Launches (consensus candidate)</title>
<style>
body{font:15px system-ui,sans-serif;margin:0;background:#0b1020;color:#e5e7eb}
header{padding:14px 16px}header h1{font-size:18px;margin:0}
#meta{padding:0 16px 8px;color:#9ca3af;font-size:13px}
#gap{display:none;margin:16px;padding:12px;border:1px solid #b45309;background:#451a03;border-radius:8px}
#hero{margin:0 16px 12px;padding:16px;border:1px solid #374151;border-radius:12px;background:#111c34;max-width:720px}
#hero .cd{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
#hero .mission{font-size:19px;font-weight:700;margin-top:6px}
#hero .sub{color:#9ca3af;font-size:13px;margin-top:4px}
ol#launches{list-style:none;margin:0;padding:0 16px 24px;max-width:720px}
ol#launches li{display:flex;gap:12px;align-items:baseline;padding:10px 4px;border-bottom:1px solid #1f2937}
ol#launches .cd{min-width:118px;font-variant-numeric:tabular-nums;color:#fbbf24;font-weight:700}
ol#launches .mission{font-weight:600}ol#launches .sub{color:#9ca3af;font-size:13px}
</style></head><body>
<header><h1>Upcoming Launches</h1></header>
<div id="meta">Loading launch feed…</div>
<div id="gap" role="alert"></div>
<div id="hero" hidden></div>
<ol id="launches"></ol>
<script>
// PROMPT-ONLY draws (gemma2:2b, verbatim intent, mechanically verified/repaired — see record):
// draw1 fmtCountdown: correct duration math + LIFTOFF; zero-pad added mechanically.
// draw2 sortLaunches: drew `.isoDate` key + in-place sort — BOTH wrong for this feed; repaired to `.net` + copy. Raw draws kept in launch-exp record.
function fmtCountdown(t){const d=t-Date.now();if(d<0)return 'LIFTOFF';const p=n=>String(n).padStart(2,'0');const s=Math.floor(d/1000);return 'T-'+Math.floor(s/86400)+'d '+p(Math.floor(s%86400/3600))+'h '+p(Math.floor(s%3600/60))+'m '+p(s%60)+'s';}
function sortLaunches(arr){return (Array.isArray(arr)?arr:[]).slice().sort((a,b)=>new Date(a.net)-new Date(b.net));}
const FEED='https://ll.thespacedevs.com/2.2.0/launch/upcoming/?limit=20&mode=list';
function showGap(msg){const g=document.getElementById('gap');g.style.display='block';g.textContent='No launch data: '+msg+' (named gap — no launches invented.)';}
let launches=[];
function when(iso){try{return new Date(iso).toUTCString();}catch(e){return 'time unknown';}}
function render(){
  const hero=document.getElementById('hero'),ol=document.getElementById('launches');
  ol.innerHTML='';
  if(!launches.length)return;
  const n=launches[0];
  hero.hidden=false;
  hero.innerHTML='';
  const cd=document.createElement('div');cd.className='cd';cd.dataset.net=n.net;cd.textContent=fmtCountdown(new Date(n.net).getTime());
  const mi=document.createElement('div');mi.className='mission';mi.textContent=n.mission||n.name||'Unnamed mission';
  const su=document.createElement('div');su.className='sub';su.textContent=[n.lsp_name,n.name,[(n.pad||''), (n.location||'')].filter(Boolean).join(' · '),when(n.net)].filter(Boolean).join(' — ');
  hero.append(cd,mi,su);
  for(const l of launches.slice(1,21)){
    const li=document.createElement('li');
    const c=document.createElement('div');c.className='cd';c.dataset.net=l.net;c.textContent=fmtCountdown(new Date(l.net).getTime());
    const d=document.createElement('div');
    const m=document.createElement('div');m.className='mission';m.textContent=l.mission||l.name||'Unnamed mission';
    const s=document.createElement('div');s.className='sub';s.textContent=[[l.lsp_name,l.name].filter(Boolean).join(' · '),[(l.pad||''),(l.location||'')].filter(Boolean).join(' · '),when(l.net)].filter(Boolean).join(' — ');
    d.append(m,s);li.append(c,d);ol.append(li);
  }
}
setInterval(()=>{document.querySelectorAll('[data-net]').forEach(el=>{el.textContent=fmtCountdown(new Date(el.dataset.net).getTime());});},1000);
async function main(){
  let j;
  try{const r=await fetch(FEED);if(!r.ok)throw new Error('HTTP '+r.status);j=await r.json();}
  catch(e){document.getElementById('meta').textContent='Feed unreachable.';showGap(String(e).slice(0,160));return;}
  const rs=Array.isArray(j.results)?j.results:[];
  if(!rs.length){document.getElementById('meta').textContent='Feed returned no launches.';showGap('feed returned zero results');return;}
  launches=sortLaunches(rs).filter(l=>l.net);
  document.getElementById('meta').textContent=launches.length+' upcoming launches, soonest first';
  render();
}
main();
</script></body></html>
