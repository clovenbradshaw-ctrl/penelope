<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upcoming Launches (control: card grid, consensus disabled)</title>
<style>
body{font:15px system-ui,sans-serif;margin:0;background:#fafafa;color:#111}
header{padding:14px 16px}header h1{font-size:18px;margin:0}
#meta{padding:0 16px 8px;color:#555;font-size:13px}
#gap{display:none;margin:16px;padding:12px;border:1px solid #b45309;background:#fef3c7;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:0 16px 24px}
.card{border:1px solid #ddd;border-radius:10px;padding:12px;background:#fff}
.card .cd{font-weight:800;font-variant-numeric:tabular-nums}.card .m{margin-top:4px;font-weight:600}.card .s{color:#555;font-size:13px;margin-top:4px}
</style></head><body>
<header><h1>Upcoming Launches</h1></header>
<div id="meta">Loading launch feed…</div>
<div id="gap" role="alert"></div>
<div class="grid" id="grid"></div>
<script>
function fmtCountdown(t){const d=t-Date.now();if(d<0)return 'LIFTOFF';const p=n=>String(n).padStart(2,'0');const s=Math.floor(d/1000);return 'T-'+Math.floor(s/86400)+'d '+p(Math.floor(s%86400/3600))+'h '+p(Math.floor(s%3600/60))+'m '+p(s%60)+'s';}
function sortLaunches(arr){return (Array.isArray(arr)?arr:[]).slice().sort((a,b)=>new Date(a.net)-new Date(b.net));}
const FEED='https://ll.thespacedevs.com/2.2.0/launch/upcoming/?limit=20&mode=list';
function showGap(msg){const g=document.getElementById('gap');g.style.display='block';g.textContent='No launch data: '+msg+' (named gap — no launches invented.)';}
async function main(){
  let j;
  try{const r=await fetch(FEED);if(!r.ok)throw new Error('HTTP '+r.status);j=await r.json();}
  catch(e){document.getElementById('meta').textContent='Feed unreachable.';showGap(String(e).slice(0,160));return;}
  const rs=Array.isArray(j.results)?j.results:[];
  if(!rs.length){document.getElementById('meta').textContent='Feed returned no launches.';showGap('feed returned zero results');return;}
  const launches=sortLaunches(rs).filter(l=>l.net);
  document.getElementById('meta').textContent=launches.length+' upcoming launches, soonest first (control grid)';
  const grid=document.getElementById('grid');grid.innerHTML='';
  for(const l of launches.slice(0,20)){
    const c=document.createElement('div');c.className='card';
    const cd=document.createElement('div');cd.className='cd';cd.dataset.net=l.net;cd.textContent=fmtCountdown(new Date(l.net).getTime());
    const m=document.createElement('div');m.className='m';m.textContent=l.mission||l.name||'Unnamed mission';
    const s=document.createElement('div');s.className='s';s.textContent=[[l.lsp_name,l.name].filter(Boolean).join(' · '),[(l.pad||''),(l.location||'')].filter(Boolean).join(' · ')].filter(Boolean).join(' — ');
    c.append(cd,m,s);grid.append(c);
  }
}
setInterval(()=>{document.querySelectorAll('[data-net]').forEach(el=>{el.textContent=fmtCountdown(new Date(el.dataset.net).getTime());});},1000);
main();
</script></body></html>
