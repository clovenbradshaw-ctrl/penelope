<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Council Watch — Metro Council meetings + agendas (zero-mouth weave)</title>
<style>
body{font:15px system-ui,sans-serif;margin:0;background:#101418;color:#e5e7eb}
header{padding:14px 16px}header h1{font-size:18px;margin:0}header .sub{color:#9ca3af;font-size:12px;margin-top:2px}
#meta,#stale{padding:0 16px 8px;color:#9ca3af;font-size:13px}#stale{color:#fbbf24}
#gap{display:none;margin:16px;padding:12px;border:1px solid #b45309;background:#451a03;border-radius:8px}
#search{margin:0 16px 8px;padding:8px;width:min(400px,80vw);border-radius:8px;border:1px solid #374151;background:#141a20;color:#e5e7eb}
#hero{margin:0 16px 12px;padding:16px;border:1px solid #374151;border-radius:12px;background:#141a20;max-width:720px}
#hero .cd{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
#hero .body{font-size:19px;font-weight:700;margin-top:6px}
#hero .sub{color:#9ca3af;font-size:13px;margin-top:4px}
ol#meetings{list-style:none;margin:0;padding:0 16px 24px;max-width:720px}
ol#meetings li{display:flex;gap:12px;align-items:baseline;padding:10px 4px;border-bottom:1px solid #1f2937;cursor:pointer}
ol#meetings .cd{min-width:118px;font-variant-numeric:tabular-nums;color:#fbbf24;font-weight:700}
ol#meetings .body{font-weight:600}ol#meetings .sub{color:#9ca3af;font-size:13px}
.agenda{margin:4px 0 0;padding:8px 10px;border-left:2px solid #374151;background:#0d1117;border-radius:0 6px 6px 0}
.agenda .item{display:flex;gap:8px;padding:3px 0;font-size:13px}
.agenda .num{min-width:34px;color:#9ca3af}
.agenda .act{color:#7dd3fc;font-size:12px;font-weight:600;white-space:nowrap}
.agenda .gap{color:#b45309;font-size:12px}
.nodetail{color:#b45309;font-size:12px}
a{color:#7dd3fc}
</style></head><body>
<header><h1>Council Watch</h1><div class="sub">Metro Council + committees — meetings soonest first, agendas in their own order. Zero-mouth weave: box owns the window, the agenda, the gaps.</div></header>
<div id="meta">Loading…</div>
<div id="stale"></div>
<div id="gap" role="alert"></div>
<input id="search" placeholder="filter agendas: titles, files, actions…" aria-label="filter agendas">
<div id="hero" hidden></div>
<ol id="meetings"></ol>
<script id="factors">
// PURE FACTORS — behavior-check loads this block alone (no DOM/IO here).
// Mirrors organs/window.mjs (Window@1) + organs/agenda-shape.mjs (AgendaShape@1),
// box-owned: the mouth was never asked for any of these shapes.
function fmtCd(ms,now){const d=ms-now;if(d<0)return 'T+'+fmtDur(-d);return 'T-'+fmtDur(d);}
function fmtDur(abs){if(abs<60000)return'00d 00h 00m 00s';const p=n=>String(n).padStart(2,'0');const s=Math.floor(abs/1000);return p(Math.floor(s/86400))+'d '+p(Math.floor(s%86400/3600))+'h '+p(Math.floor(s%3600/60))+'m '+p(s%60)+'s';}
function minutesOf(t){const s=String(t||'').trim();if(!s)return null;const m12=s.match(/^(\d{1,2}):(\d{2})\s*([AP]M)$/i);if(m12){let h=Number(m12[1])%12;if(/^P/i.test(m12[3]))h+=12;return h*60+Number(m12[2]);}const m24=s.match(/^(\d{1,2}):(\d{2})$/);if(!m24)return null;const h=Number(m24[1]);return h>23?null:h*60+Number(m24[2]);}
function toEpoch(dateStr,timeStr){const d=new Date(dateStr);if(isNaN(d.getTime()))return null;const m=minutesOf(timeStr);return m==null?d.getTime()+12*3600000:d.getTime()+m*60000;}
function upcoming(now,meetings,n){const rows=[],gaps=[];for(let i=0;i<(meetings||[]).length;i+=1){const at=toEpoch(meetings[i].date,meetings[i].time);if(at==null){gaps.push(i);continue;}if(at<now)continue;rows.push({rec:meetings[i],at,cd:fmtCd(at,now)});}rows.sort((a,b)=>a.at-b.at);return{rows:rows.slice(0,n),gaps,total:rows.length};}
function shapeAgenda(items){const rows=(items||[]).map((item,idx)=>({seq:item.seq,idx,num:item.num,title:item.title,matter:item.matter,type:item.type,action:item.action,note:item.note??null,gap:item.seq==null||!item.title?('item '+idx+': '+(!item.title?'no title':'')+(item.seq==null?' no sequence':'')):null})).sort((a,b)=>{if(a.seq==null)return 1;if(b.seq==null)return-1;return a.seq-b.seq;});return{rows,gaps:rows.filter(r=>r.gap).map(r=>r.idx)};}
function filterAgenda(q,items){const n=String(q||'').toLowerCase();return(items||[]).filter(x=>(((x.title||'')+' '+(x.matter||'')+' '+(x.type||'')+' '+(x.action||''))).toLowerCase().includes(n));}
function resolveMeeting(id,meetings){return(meetings||[]).find(x=>x&&x.id===id)||null;}
function freshLabel(fetchedAt,now,ttl){const a=now-fetchedAt;if(!(a>=0))return{state:'unknown',badge:'time unknown'};if(a<=ttl)return{state:'fresh',badge:'updated '+Math.floor(a/1000)+'s ago'};if(a<=3*ttl)return{state:'stale',badge:'stale — last good '+new Date(fetchedAt).toUTCString()};return{state:'expired',badge:'data expired — refresh failed (named gap)'};}
</script>
<script id="wiring">
// Council Watch assembly — every line box-owned. Mouth calls in this artifact: 0.
// Window + agenda shapes are organs (Window@1, AgendaShape@1); gaps are named,
// never invented; freshness is fresh/stale/expired (Freshness@1 semantics).
const N=8,TOP=12,TTL=300000;
let meetings=[],fetchedAt=0;
const FEED=()=>'/api/council/events';
function showGap(m){const g=document.getElementById('gap');g.style.display='block';g.textContent='No council data: '+m+' (named gap — no meetings invented.)';}
function hideGap(){document.getElementById('gap').style.display='none';}
async function fetchRetry(url,tries){let last=null;for(let a=0;a<tries;a+=1){const r=await fetch(url);last=r;if(r.status!==429)return r;const wait=Math.min(10000,(Number(r.headers.get('Retry-After'))||2)*1000);await new Promise(res=>setTimeout(res,wait));}return last;}
function agendaEl(m){
  const box=document.createElement('div');box.className='agenda';
  const shaped=shapeAgenda(m.agenda);
  if(m.agendaGap){const g=document.createElement('div');g.className='gap';g.textContent='agenda unavailable ('+m.agendaGap.slice(0,80)+')';box.append(g);return box;}
  if(!shaped.rows.length){const g=document.createElement('div');g.className='gap';g.textContent='agenda empty — no items at the feed (named gap)';box.append(g);return box;}
  const q=document.getElementById('search').value;
  const rows=filterAgenda(q,shaped.rows);
  if(!rows.length){const g=document.createElement('div');g.className='gap';g.textContent='no agenda item matches "'+q+'"';box.append(g);return box;}
  for(const r of rows){
    const it=document.createElement('div');it.className='item';
    const num=document.createElement('span');num.className='num';num.textContent=r.num||'';
    const body=document.createElement('span');
    const t=document.createElement('span');t.textContent=r.title||'(no title)';
    body.append(t);
    if(r.matter){const f=document.createElement('span');f.textContent=' '+r.matter;f.style.color='#9ca3af';body.append(f);}
    if(r.type){const f=document.createElement('span');f.textContent=' ('+r.type+')';f.style.color='#9ca3af';body.append(f);}
    it.append(num,body);
    if(r.action){const a=document.createElement('span');a.className='act';a.textContent=r.action;it.append(a);}
    if(r.gap){const g=document.createElement('span');g.className='gap';g.textContent=r.gap;it.append(g);}
    box.append(it);
  }
  return box;
}
async function loadAgenda(m){
  if(m.agenda&&m.agenda.length)return;
  m.agenda=m.agenda||[];
  try{
    const r=await fetchRetry(m.itemsUrl,2);if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    m.agenda=(j||[]).map(x=>({seq:x.EventItemAgendaSequence,num:x.EventItemAgendaNumber,title:x.EventItemTitle??x.EventItemMatterTitle??null,matter:x.EventItemMatterFile??null,type:x.EventItemMatterType??null,action:x.EventItemActionName??null,note:x.EventItemAgendaNote??null}));
  }catch(e){m.agendaGap=String(e.message||e).slice(0,120);}
}
function renderList(q){
  const ol=document.getElementById('meetings');ol.innerHTML='';
  const rows=upcoming(Date.now(),meetings,N).rows;
  for(const {rec:m,at,cd} of rows){
    const li=document.createElement('li');li.dataset.id=m.id;
    const c=document.createElement('div');c.className='cd';c.dataset.at=at;c.textContent=cd;
    const d=document.createElement('div');
    const b=document.createElement('div');b.className='body';b.textContent=m.body;
    const s=document.createElement('div');s.className='sub';
    s.textContent=[m.date.replace('T00:00:00','')+' '+m.time,m.loc,m.status?('agenda '+m.status):''].filter(Boolean).join(' — ');
    d.append(b,s);
    if(m.agendaGap){const g=document.createElement('div');g.className='gap';g.textContent='agenda unavailable ('+m.agendaGap.slice(0,60)+')';d.append(g);}
    li.append(c,d);
    li.addEventListener('click',()=>showMeeting(m.id));
    ol.append(li);
  }
  return rows.length;
}
async function showMeeting(id){
  const m=resolveMeeting(id,meetings);if(!m)return;
  const hero=document.getElementById('hero');hero.hidden=false;hero.innerHTML='';
  const cd=document.createElement('div');cd.className='cd';cd.dataset.at=toEpoch(m.date,m.time);cd.textContent=fmtCd(toEpoch(m.date,m.time),Date.now());
  const b=document.createElement('div');b.className='body';b.textContent=m.body;
  const s=document.createElement('div');s.className='sub';
  s.textContent=[m.date.replace('T00:00:00','')+' '+m.time,m.loc].filter(Boolean).join(' — ');
  const link=document.createElement('div');link.className='sub';
  const a=document.createElement('a');a.href=m.url;a.target='_blank';a.rel='noopener';a.textContent='open in Legistar ↗';
  link.append(a);
  hero.append(cd,b,s,link);
  await loadAgenda(m);
  hero.append(agendaEl(m));
}
function tick(){
  document.querySelectorAll('[data-at]').forEach(el=>{el.textContent=fmtCd(Number(el.dataset.at),Date.now());});
  if(!fetchedAt)return;
  const l=freshLabel(fetchedAt,Date.now(),TTL);
  document.getElementById('stale').textContent=l.state==='fresh'?'':l.badge;
  if(l.state==='expired'){document.getElementById('meetings').innerHTML='';document.getElementById('hero').hidden=true;showGap(l.badge);}
}
async function load(){
  hideGap();
  document.getElementById('meta').textContent='Loading council feed…';
  const r=await fetchRetry(FEED(),3);if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(!Array.isArray(j)||!j.length)throw new Error('feed returned zero results');
  meetings=j.map(x=>({id:x.EventId,body:x.EventBodyName||'Unnamed body',date:x.EventDate||'',time:x.EventTime||null,loc:x.EventLocation||'',status:x.EventAgendaStatusName||null,url:x.EventInSiteURL||'',itemsUrl:'/api/council/events/'+x.EventId+'/items',agenda:[],agendaGap:null}));
  fetchedAt=Date.now();hideGap();
  document.getElementById('meta').textContent=meetings.length+' upcoming meetings, soonest first — agenda loads per meeting';
  renderList(document.getElementById('search').value);
}
function tickAgendas(){
  for(const m of meetings){if(m.agenda&&m.agenda.length)continue;if(m.loading)continue;m.loading=true;loadAgenda(m).finally(()=>{m.loading=false;});}
}
document.getElementById('search').addEventListener('input',e=>{
  renderList(e.target.value);
  const hero=document.getElementById('hero');
  if(!hero.hidden){const m=resolveMeeting(hero.dataset.id||'',meetings);if(m)hero.querySelector('.agenda')?.replaceWith(agendaEl(m));}
});
document.getElementById('hero').addEventListener('click',e=>{e.stopPropagation();});
setInterval(tick,1000);
setInterval(()=>load().catch(e=>{const l=freshLabel(fetchedAt||0,Date.now(),TTL);document.getElementById('stale').textContent=l.badge;}),TTL);
setInterval(tickAgendas,15000);
load().catch(e=>{document.getElementById('meta').textContent='Feed unreachable.';showGap(String(e.message||e).slice(0,160));});
</script></body></html>
