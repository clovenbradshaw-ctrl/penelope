name: model-free-weave-boundary

on:
  push:
    branches:
      - experiment/model-free-weave-boundary
  workflow_dispatch:

jobs:
  model-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:no-model
      - run: npm test
